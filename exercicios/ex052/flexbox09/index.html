<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.conteiner {
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            background-color: burlywood;
            height: 400px;
        }

        div.item {
            background-color: rgb(17, 250, 250);
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin: 5px;
        }

        div#cxA {
            /*  
                flex-basis: 150px;   
                flex-grow: 0;
                flex-shrink: 1; 
            */
            
            flex: 0 1 150px;
        }

        div#cxB {
            /*  
                flex-basis: 150px;   
                flex-grow: 2;
                flex-shrink: 0; 
            */

            flex: 2 0 150px;
        }

        div#cxC {
            /*
                flex-basis: 150px;
                flex-grow: 1;
                flex-shrink: 2;
            */

            flex: 1 2 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner"> 
        <div class="item" id="cxA">Teste 1</div>
        <div class="item" id="cxB">Teste 2</div>
        <div class="item" id="cxC">Teste 3</div>
    </div>   
</body>
</html>
