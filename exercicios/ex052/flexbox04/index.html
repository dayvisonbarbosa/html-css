<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        header > h1 {
            text-align: center;    
        }

        section#conteiner {
            display: flex;
            flex-flow: row nowrap;
            align-items: center;
            justify-content: space-evenly;
            background-color: antiquewhite;
            height: 500px;
        }

        p.item {
            border: 1px solid black;
            font-size: 1.5em;
            margin: 10px;
            width: 100px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Teste de Centralização</h1>
        <section id="conteiner">
           <p class="item">HTML5 e CSS3</p>
           <p class="item">JavaScript e C#</p>
           <p class="item">Java e <br> php</p>
        </section>
    </header>   
</body>
</html>
