<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 002</title>
</head>
<body>
    <h1>Formulário com senha</h1>    
    <form action="arquivo.php" method="post" autocomplete="on">  
        <p>
            <label for="iusu">Usuário:</label>
            <input type="text" name="user" id="iuser" minlength="5" maxlength="30" size="10" placeholder="Digite seu nome">
        </p>
        
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" name="senha" id="isenha" minlength="8" maxlength="15" size="10" placeholder="Digite sua senha">
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
