<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulários com color, range e file</h1>   
    <form action="arquivo.php" method="post" autocomplete="on">
        <p>
            <label for="icor">Selecionar cor:</label>
            <input type="color" name="cor" id="icor" value="#1600F5">
        </p>

        <p>
            <label for="isat">Nível de Satisfação:</label>
            <input type="range" name="sat" id="isat" min="0" max="5" value="5">
        </p>

        <p>
            <label for="iarq">Enviar arquivo:</label>
            <input type="file" name="arq" id="iarq">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
